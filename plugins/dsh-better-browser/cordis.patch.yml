# The dsh-better-browser bundle patch: registers the Kimi WebBridge host plugin
# into the profile.
#
# The row id `webbridge` is kept stable for existing profile overlays and the
# `webbridge_*` protocol contract. Loader row ids must be unique: if another
# bundle already inserts `webbridge`, remove or disable one of the two rows
# before booting the profile.
#
# The plugin is host-only: it registers webbridge_* model tools on the `tools`
# service and needs no client bundle.

- insert:
    # Browser control through the user's REAL browser: the Kimi WebBridge host
    # plugin surfaces the local kimi-webbridge daemon (installed separately,
    # see README) as webbridge_* model tools.
    - id: webbridge
      name: '@dsh-external/dsh-better-browser'
