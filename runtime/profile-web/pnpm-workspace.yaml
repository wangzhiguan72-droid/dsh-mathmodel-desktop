packages:
  - .

nodeLinker: hoisted
autoInstallPeers: false
ignoreWorkspaceRootCheck: true

# dsh-better-sidebar 0.18.0 pins the whole 0.1.2-rc.1 kernel cohort
# (dsh-agent -> dsh-llm, dsh-session, ...), whose copies shadow the 0.1.5 host
# closure in the profile tree and break ESM imports. 0.19.1 targets the
# 0.1.5-rc.1 cohort. The @deepseek-ai overrides keep the dsh-mathmodel
# plugin's own 0.1.1-rc.2 framework copies (cordis, dsh-invariants,
# dsh-typert-protocol) aligned with what the 0.1.5-rc.1 host ships; bump
# together with runtime/host/package.json.
overrides:
  dsh-better-sidebar: 0.19.1
  '@deepseek-ai/cordis': 4.0.2
  '@deepseek-ai/dsh-invariants': 0.1.5-rc.2
  '@deepseek-ai/dsh-typert-protocol': 0.1.5-rc.2

supportedArchitectures:
  os:
    - darwin
    - win32
  cpu:
    - x64
    - arm64

# cloudflared fetches its binary for the build platform; node-pty checks its
# shipped prebuilds. cpu-features and ssh2 only build an optional native
# accelerator with a pure-JS fallback, so they are approved as skipped.
allowBuilds:
  cloudflared: true
  cpu-features: false
  node-pty: true
  ssh2: false

minimumReleaseAgeExclude:
  - 'dsh-better-sidebar@0.18.0'
  - '@linxin666/dsh-client-ui-community-plugins@0.3.14'
  - '@linxin666/dsh-client-ui-git-graph@0.3.14'
  - '@linxin666/dsh-client-ui-market@0.3.14'
  - '@linxin666/dsh-client-ui-plugin-manager@0.3.14'
  - '@linxin666/dsh-client-ui-skill-explorer@0.3.14'
  - '@linxin666/dsh-client-ui-skin-center@0.3.14'
  - '@linxin666/dsh-client-ui-task-board@0.3.14'
  - '@linxin666/dsh-client-ui-web-ui-settings@0.3.14'
  - '@linxin666/dsh-doctor@0.3.14'
  - '@linxin666/dsh-i18n@0.3.14'
  - '@linxin666/dsh-liangshen@0.3.14'
  - '@linxin666/dsh-pet@0.3.14'
  - '@linxin666/dsh-remote-web-ui@0.3.14'
  - '@linxin666/dsh-session-archive@0.3.14'
  - '@linxin666/dsh-ssh@0.3.14'
  - '@linxin666/dsh-tool-describe-image@0.3.14'
  - '@linxin666/dsh-usage@0.3.14'
  - '@linxin666/dsh-web-all@0.3.14'
